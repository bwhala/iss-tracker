# Disable Wi-Fi power saving — installed to /etc/NetworkManager/conf.d/
#
# brcmfmac SDIO firmware hangs (seen 2026-08-05: NetworkManager and
# wpa_supplicant stuck in D-state for 47h until power cycle) are commonly
# triggered with power save enabled. This appliance is mains-powered; the
# power saving buys nothing.
#
# 2 = disable, 3 = enable, 1 = default, 0 = ignore
[connection]
wifi.powersave = 2
