# Hardware watchdog (BCM2835/bcm2835_wdt) — installed to /etc/systemd/system.conf.d/
#
# Raspberry Pi OS already arms the runtime watchdog: systemd pets
# /dev/watchdog0 with a 1-minute timeout (40-rpi-enable-watchdog.conf in
# /usr/lib/systemd/system.conf.d), so a full kernel hang self-recovers out
# of the box. Deliberately not tightened here — under heavy load/swap thrash
# a short timeout risks spurious reboots.
#
# RebootWatchdogSec (default 10min): the watchdog stays armed during reboot,
# so a reboot that wedges on hung (D-state) tasks — the 2026-08-05 brcmfmac
# failure mode — still completes via hardware reset within 2 minutes. This
# backstops the net-watchdog's forced-reboot escalation stage.
[Manager]
RebootWatchdogSec=2min
